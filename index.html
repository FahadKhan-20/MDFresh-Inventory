<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD FRESH — Internal Inventory Management System</title>
  <meta name="description" content="MD Fresh Enterprise Inventory Management System - Fast numeric daily stock check, multi-branch APMC mandi procurement, and live stock tracking across Bengaluru.">
  
  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/src/style.css">
  <link rel="icon" type="image/png" href="/logo.png?v=3">

  <!-- Progressive Web App (PWA) Manifest & Mobile App Capabilities -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0D8244">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MD Fresh">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png">

  <!-- Instant PWA Install Listener & Service Worker Registration (Critical for Mobile Chrome) -->
  <script>
    // Early capture before deferred scripts execute
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredPrompt = e;
      window.dispatchEvent(new CustomEvent('md-fresh-pwa-ready'));
    });

    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(function(reg) {
          console.log('[MD Fresh PWA] SW registered immediately:', reg.scope);
        })
        .catch(function(err) {
          console.warn('[MD Fresh PWA] SW registration failed:', err);
        });
    }
  </script>

  <!-- Suppress and purge any Netlify edge-injected floating badge / overlays -->
  <script>
    (function() {
      function purgeNetlifyBadge() {
        var items = document.querySelectorAll('netlify-badge, netlify-drawer, [data-netlify-badge], [data-netlify-drawer], iframe[src*="netlify"], div[id*="netlify"], div[class*="netlify"]');
        items.forEach(function(el) { el.remove(); });
        if (document.body) {
          Array.from(document.body.children).forEach(function(child) {
            if (child.id !== 'app' && child.tagName !== 'SCRIPT' && child.tagName !== 'LINK' && child.tagName !== 'STYLE') {
              var tag = child.tagName.toLowerCase();
              var id = (child.id || '').toLowerCase();
              var cls = (child.className || '').toString().toLowerCase();
              if (tag.indexOf('netlify') !== -1 || id.indexOf('netlify') !== -1 || cls.indexOf('netlify') !== -1 || child.shadowRoot) {
                child.remove();
              }
            }
          });
        }
      }
      purgeNetlifyBadge();
      if (typeof MutationObserver !== 'undefined') {
        var obs = new MutationObserver(purgeNetlifyBadge);
        obs.observe(document.documentElement, { childList: true, subtree: true });
      }
    })();
  </script>
</head>
<body>
  <!-- Opening Splash Screen matching Fruitmart-main -->
  <div id="md-splash" class="sp-root" role="status" aria-label="Loading MD FRESH">
    <div class="sp-sheet">
      <video src="/videos/splash.mp4" autoplay muted playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
    </div>
    <div class="sp-logo-wrap">
      <img src="/images/logo-splash.webp" alt="MD FRESH" class="sp-logo" draggable="false" />
    </div>
  </div>

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
